<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not Found</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
// /p/<name>/ (or /p/en/<name>/) -> the SPA route for that document;
// anything else -> the wiki home. A dead /p/en/ URL keeps its
// language by asking the SPA for English (?lang=en), so an English
// reader whose bookmark rotted does not land in Korean.
var m = location.pathname.match(/\/p\/(?:([a-z]{2})\/)?([A-Za-z0-9._-]+)\/?$/);
var q = m && m[1] && m[1] !== "ko" ? "?lang=" + m[1] : "";
location.replace(m ? "/" + q + "#!" + m[2] : "/");
</script>
</head>
<body>
<p><a href="/">Aaron's Claude Wiki</a></p>
</body>
</html>
