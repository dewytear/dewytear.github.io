    <!-- Structured data: advertise the machine-readable knowledge graph so an
         AI/crawler discovers the traversal entry points (llms.txt + graph JSON). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://dewytear.github.io/#website",
          "name": "Aaron's Claude Wiki",
          "url": "https://dewytear.github.io/",
          "inLanguage": "ko",
          "license": "https://creativecommons.org/licenses/by/4.0/",
          "description": "A trilingual (KO·EN·JA) LLM wiki written by AI and curated by a human — a published second brain with Graph Studio for people, and llms.txt + knowledge-graph.json for AIs: a RAG-ready knowledge source."
        },
        {
          "@type": "Dataset",
          "name": "Aaron's Claude Wiki — Knowledge Graph",
          "description": "A self-contained knowledge graph of this wiki. Nodes are documents; edges are rarity-weighted shared concepts plus five human-declared relation types (prerequisite, implements, example-of, evidence-for, supersedes). Download it as a single JSON file and traverse it as-is — the hierarchy is four levels (World · Domain · System · Document), a traversal guide is included, and Graph Studio lets you explore the same graph live in the browser.",
          "url": "https://dewytear.github.io/docs/ko/ai/map/ai-guide",
          "isAccessibleForFree": true,
          "license": "https://creativecommons.org/licenses/by/4.0/",
          "creator": { "@type": "Person", "name": "dewytear" },
          "distribution": [
            { "@type": "DataDownload", "encodingFormat": "application/json",
              "contentUrl": "https://dewytear.github.io/data/knowledge-graph.json" },
            { "@type": "DataDownload", "encodingFormat": "text/plain",
              "contentUrl": "https://dewytear.github.io/llms.txt" },
            { "@type": "DataDownload", "encodingFormat": "text/plain",
              "contentUrl": "https://dewytear.github.io/llms-full.txt" },
            { "@type": "DataDownload", "encodingFormat": "application/atom+xml",
              "contentUrl": "https://dewytear.github.io/feed.xml" }
          ]
        }
      ]
    }
    </script>

         static snapshots. -->
    <noscript>
        <p><a href="p/">문서 전체 목록 · All documents</a> —

    <!-- Floating background-music control. The title beside it is filled from
         the player's own metadata while playing (decorative — the button's
         aria-label already announces the state, so it stays hidden from AT). -->
    <span id="music-title" aria-hidden="true"></span>
    <button id="music-btn" type="button" class="idle" onclick="toggleMusic();"
            aria-label="배경음악 재생" title="배경음악">
        <span class="music-eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </button>

    <script>

        // Apply the theme as early as possible (light is the default) so the
        // page doesn't flash the dark theme before settings load.
        (function(){
            try{
                var s = JSON.parse(localStorage.getItem('wikiSettings')) || {};
                if((s.theme || 'day') === 'day'){ document.body.classList.add('day'); }
            }catch(e){ document.body.classList.add('day'); }
            // Desktop sidebar: HIDDEN by default on first visit; only an
            // explicit expand ('0') keeps it open. The class only takes
            // effect on wide screens (scoped in CSS).
            try{
                if(localStorage.getItem('navCollapsed') !== '0'){
                    document.body.classList.add('nav-collapsed');
                }
            }catch(e){ document.body.classList.add('nav-collapsed'); }
        })();


    </script>
    <!-- 방문 집계(GoatCounter) — 쿠키·개인정보 수집 없음, ~3KB.
         no_onload: 해시 라우팅이라 자동 집계를 끄고 app.js의 라우터가
         문서 단위(#!name → /name)로 직접 센다(중복·미집계 동시 방지). -->
    <script data-goatcounter="https://dewytear.goatcounter.com/count"
            data-goatcounter-settings='{"no_onload": true}'
            async src="//gc.zgo.at/count.js"></script>
