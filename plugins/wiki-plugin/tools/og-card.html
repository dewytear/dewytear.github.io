<!doctype html>
<!-- og-image.png의 원본. 장식용 그림이 아니라 **위키의 실제 지식그래프**를
     싣는다 — cosmos.js(사이트의 3D 지식그래프 렌더러)를 심(shim) 5개로 단독
     구동하되, 카드에서는 단순화한다(사용자 결정): 글자(라벨·명판)는 전부 빼고
     data/knowledge-graph.json에서 가장 많이 참조되는 허브 40개만 성긴
     "별자리"로 렌더. 문서가 늘거나 허브가 바뀌면 카드도 따라 변한다.

     재생성:  python3 -m http.server 8799   (저장소 루트에서)
              chromium --headless --remote-debugging-port=9333 &
              http://127.0.0.1:8799/tools/og-card.html 을 1200×630으로 열어
              document.title이 READY가 된 뒤 스크린샷 → og-image.png로 커밋.
     결정론:  cosmos.js 레이아웃은 FNV 해시 + Fibonacci 구(무작위원 없음).
              여기서 ①prefers-reduced-motion을 강제해 시간의존(트윙클·브리딩)을
              끄고 ②requestAnimationFrame을 3프레임에서 멈춰 카메라(rotY)를
              고정하므로, 같은 데이터·같은 cosmos.js면 같은 그림이 나온다. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  /* cosmos.js가 색을 파생하는 밤 테마 토큰 (style.css :root와 동일 값) */
  :root { --accent:#4db6ac; --text:#e6e8eb; --muted:#9aa4b2; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; }
  body {
    /* 실제 밤 테마 --bg(#1b2230)를 기준으로 좌상→우하 미세 명도 변화 */
    background:linear-gradient(135deg,#232c3e 0%,#1b2230 46%,#131a27 100%);
    font-family:"Pretendard Variable", Pretendard, system-ui, sans-serif;
    color:var(--text);
    position:relative;
    overflow:hidden;
  }
  /* 렌더러 무대 — 구의 중심은 래퍼 중앙(W/2, H*0.54), 크기는 min(W,H)에서
     나온다. 세로를 카드보다 훨씬 크게(1000px) 잡아 캔버스의 위·아래 경계를
     화면 밖으로 보낸다 — 경계가 화면 안에 있으면 별밭·성운의 은은한 밝기가
     그 줄에서 뚝 끊겨 가로 라인으로 보인다(실측 y=603 휘도 단차). 가로는
     min이 되는 760px이라 좌우 경계가 화면 안에 남는데, 이는 아래 마스크가
     부드럽게 페이드시킨다. */
  #stage { position:absolute; left:415px; top:-275px; width:760px; height:1000px; z-index:1; }
  .cosmos-canvas {
    position:absolute; inset:0;
    -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 52px, #000 calc(100% - 52px), transparent 100%);
    mask-image:linear-gradient(90deg, transparent 0, #000 52px, #000 calc(100% - 52px), transparent 100%);
  }
  /* 헤드라인 대비 확보 — 왼쪽 어둡힘 + 하단 받침 (캔버스는 렌더러 소유라
     CSS 오버레이로). */
  .shade {
    position:absolute; inset:0; z-index:2; pointer-events:none;
    background:
      linear-gradient(0deg, rgba(17,23,34,.62) 0%, rgba(17,23,34,.38) 9%,
        rgba(17,23,34,.18) 18%, rgba(17,23,34,.06) 28%, rgba(17,23,34,0) 40%),
      linear-gradient(90deg,
        rgba(17,23,34,.94) 0%, rgba(17,23,34,.78) 44%,
        rgba(17,23,34,.30) 64%, rgba(17,23,34,0) 82%);
  }
  .wrap {
    position:relative; z-index:3;
    height:100%; display:flex; flex-direction:column; justify-content:center;
    padding:0 80px; max-width:790px;
  }
  .eyebrow {
    display:inline-flex; align-items:center; gap:12px;
    font-size:22px; letter-spacing:.14em; text-transform:uppercase;
    color:#ffbe8f; font-weight:700; margin-bottom:26px;
  }
  .eyebrow::before { content:""; width:34px; height:2px; background:#ff6600; }
  h1 { font-size:82px; font-weight:800; letter-spacing:-.025em; line-height:1.06; color:#f4f6f9; }
  h1 .accent {
    background:linear-gradient(100deg,#ff8a3d,#ff6600);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub {
    margin-top:28px; font-size:29px; color:#c3cbd6; font-weight:500;
    line-height:1.55; white-space:nowrap;
    text-shadow:0 2px 14px rgba(17,23,34,.95), 0 0 4px rgba(17,23,34,.8);
  }
  .sub em { font-style:italic; color:#ffffff; }
  .stats {
    position:absolute; left:80px; bottom:48px; z-index:3;
    display:flex; gap:14px;
  }
  .chip {
    padding:12px 24px; border:1px solid rgba(255,255,255,.22); border-radius:999px;
    font-size:23px; color:#dfe4ea; background:rgba(20,27,40,.55); font-weight:500;
  }
  .chip b { color:#ff9d55; font-weight:800; }
  .url {
    position:absolute; right:80px; bottom:56px; z-index:3;
    font-size:23px; color:#a7b0be; letter-spacing:.02em; font-weight:500;
    text-shadow:0 2px 12px rgba(17,23,34,.95);
  }
</style>
</head>
<body>
<div id="stage"><canvas class="cosmos-canvas"></canvas></div>
<div class="shade"></div>
<div class="wrap">
  <p class="eyebrow">A knowledge graph you can read</p>
  <h1>Aaron's <span class="accent">Claude</span> Wiki</h1>
  <p class="sub">One index, nine views — every document linked by concepts,<br>
     gated by validators, readable by people <em>and</em> AI.</p>
</div>
<div class="stats">
  <span class="chip"><b>78</b> docs</span>
  <span class="chip"><b>340</b> concepts</span>
  <span class="chip"><b>KO·EN·JA</b></span>
</div>
<p class="url">dewytear.github.io</p>
<script>
// ---- cosmos.js 단독 구동 심(shim) ----
// startCosmos()가 앱에서 기대하는 전역 5개만 채운다. 엔진은 무수정.
var GAME_FONT = '"Pretendard Variable", Pretendard, sans-serif';
function STR(){ return ''; }
function effSettings(){
  // cosmosRoundness는 사이트 기본값(55) 그대로.
  return { hiddenCats: [], cosmosLabelMin: 12, cosmosRoundness: 55 };
}
// 그래프 단순화 — 카드에서는 그래프 안 글자(문서 라벨·World/System 명판)를
// 전부 뺀다(사용자 결정). 엔진을 고치지 않고 캔버스 fillText만 무력화 —
// 점·엣지·성운·별밭은 그대로다.
CanvasRenderingContext2D.prototype.fillText = function(){};
var KNOWLEDGE = null, KNOWLEDGE_STATS = null;
// 결정론 ① — reduced-motion 강제: 더스트 트윙클·별 브리딩의 performance.now()
// 의존을 꺼서 어느 순간에 찍어도 같은 그림이 되게 한다.
(function(){
  var mm = window.matchMedia && window.matchMedia.bind(window);
  window.matchMedia = function(q){
    if (/prefers-reduced-motion/.test(q)) {
      return { matches: true, media: q, addListener: function(){}, addEventListener: function(){} };
    }
    return mm ? mm(q) : { matches: false, media: q, addListener: function(){}, addEventListener: function(){} };
  };
})();
// 결정론 ② — 정확히 3프레임만 그리고 멈춘다. 자동 회전이 프레임당
// rotY += 0.0018이므로 카메라는 0.6 + 0.0054로 고정된다.
(function(){
  var raf = window.requestAnimationFrame.bind(window), n = 0;
  window.requestAnimationFrame = function(cb){
    if (n >= 3) { document.title = 'READY'; return 0; }   // 스크린샷 신호
    n++; return raf(cb);
  };
})();
</script>
<script src="../cosmos.js"></script>
<script>
fetch('../data/knowledge-graph.json').then(function(r){ return r.json(); }).then(function(g){
  // 그래프 단순화(사용자 결정) — 115노드 전부는 카드에서 복잡하게만 읽히므로,
  // 가장 많이 참조되는 허브 40개만 추려 성긴 "별자리"로 보여 준다.
  // 선정도 데이터(피참조수)에서만 나오므로 결정론은 유지된다(동률은 파일 순서).
  var indeg = {};
  g.nodes.forEach(function(d){
    (d.related || []).forEach(function(r){ indeg[r.name] = (indeg[r.name] || 0) + 1; });
  });
  var keep = g.nodes.slice()
    .sort(function(a, b){ return (indeg[b.name] || 0) - (indeg[a.name] || 0); })
    .slice(0, 40);
  var keepSet = {};
  keep.forEach(function(d){ keepSet[d.name] = 1; });
  KNOWLEDGE = {};
  keep.forEach(function(d){
    KNOWLEDGE[d.name] = { title: d.title, section: d.section,
      related: (d.related || []).filter(function(r){ return keepSet[r.name]; }) };
  });
  KNOWLEDGE_STATS = g.stats;
  startCosmos();
});
</script>
</body>
</html>
