<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 미니 지식그래프 — 허브 노드 + 위성 3개. 배경 투명,
       OS 밝기에 따라 낮 orange / 밤 teal 자동 전환(테마 토큰과 동일 값). -->
  <style>
    .e{stroke:#5f6368}
    .n{fill:#ff6600}
    @media (prefers-color-scheme: dark){
      .e{stroke:#9aa4b2}
      .n{fill:#4db6ac}
    }
  </style>
  <g class="e" stroke-width="3.5" opacity=".85">
    <line x1="41" y1="25" x2="15" y2="15"/>
    <line x1="41" y1="25" x2="17" y2="47"/>
    <line x1="41" y1="25" x2="49" y2="52"/>
    <line x1="17" y1="47" x2="49" y2="52"/>
  </g>
  <circle class="n" cx="41" cy="25" r="9.5"/>
  <circle class="n" cx="15" cy="15" r="5.5"/>
  <circle class="n" cx="17" cy="47" r="6.5"/>
  <circle class="n" cx="49" cy="52" r="5.5"/>
</svg>
